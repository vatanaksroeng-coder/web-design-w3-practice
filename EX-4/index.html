<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>profile card</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
        <div class="profile-card">
            <img src="profile.jpg" alt="Profile Image" width="100">
        </div>
    <button>Edit profile</button>
    <div class="form-group">
        <label>Full Name:</label>
        <input type="text" value="Sroeng vatanak">
    </div>
    <div class="form-group">
        <label>Email:</label>
        <div class="input-with-icon">
            <span class="icon">✉</span>
            <input type="email" value="sroeng.vatanak@gmail.com">
        </div>
    </div>
    <div class="form-group">
        <label>Phone Number:</label>
        <div class="input-with-icon">
            <span class="icon">📞</span>
            <input type="tel" value="095 480549">
        </div>
    </div>
    <div class="short bio">
         <p> I am from Takeo province and earned an Grade A on my BacII exam in 2025. Currently, I am a sophomore student at CADT studying Computer Science specializing in Software Engineering</p>
    </div>
</body>
</html>
